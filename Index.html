<!doctype html>
<html lang="sw">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E5161">
<title>AfriSoma — Kiswahili Learning Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --teal-950:#06303E;--teal-900:#0A4254;--teal-800:#0D5B6B;--teal-700:#0E5161;
  --cyan:#1AB4C8;--green:#25A55A;--green-2:#3CC070;--gold:#E8A91B;--gold-2:#F4C542;
  --purple:#5B50D8;--turq:#13A89B;
  --ink:#12323B;--mut:#5E7780;--line:#DCEAE6;--sheet:#F7FBFA;--white:#fff;
  --red:#D9473A;--okbg:#D3EEDA;--badbg:#F9DEDA;
  --f:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:#E8F0ED;color:var(--ink);font-family:var(--f);
  padding-block:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--gold-2);outline-offset:2px}
h1,h2,h3,p{margin:0}

/* ---------- stage ---------- */
.stage{height:100%;display:flex;gap:56px;align-items:center;justify-content:center}
.aside{width:340px;display:flex;flex-direction:column;gap:22px;flex:none}
.icontile{
  aspect-ratio:1;border-radius:26%;
  background:linear-gradient(160deg,#0B4F61,#06303E 70%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6px;padding:26px;box-shadow:0 24px 50px -18px rgba(6,48,62,.55);
}
.icontile svg{width:62%;height:auto}
.wm{
  font-weight:800;letter-spacing:-.02em;
  background:linear-gradient(180deg,#F7D774,#D99A12);
  -webkit-background-clip:text;background-clip:text;color:transparent;line-height:1;
}
.tag{color:#fff;font-weight:500}
.jump{display:flex;flex-wrap:wrap;gap:8px}
.jump button{
  background:#fff;border:2px solid var(--line);border-radius:14px;
  padding:8px 14px;font-size:13px;font-weight:600;
}
.jump button.on{background:var(--teal-900);border-color:var(--teal-900);color:#fff}
.aside small{font-size:12.5px;color:var(--mut);line-height:1.5}
.aside .up{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}

/* ---------- phone ---------- */
.phone{
  position:relative;width:390px;height:min(844px,100%);flex:none;
  background:#0C1417;border-radius:56px;padding:11px;
  box-shadow:0 40px 80px -30px rgba(6,48,62,.6),inset 0 0 0 2px #2A3A40;
}
.phone .dev{
  position:relative;height:100%;border-radius:46px;overflow:hidden;
  background:linear-gradient(180deg,var(--teal-800),var(--teal-950));
  display:flex;flex-direction:column;isolation:isolate;
}
.notch{
  position:absolute;top:9px;left:50%;transform:translateX(-50%);
  width:112px;height:30px;border-radius:16px;background:#050A0C;z-index:20;
}
.status{
  flex:none;height:46px;display:flex;align-items:flex-end;justify-content:space-between;
  padding:0 30px 4px 34px;color:#fff;font-size:14px;font-weight:700;
}
.status span:last-child{display:flex;gap:5px;align-items:center}
.app{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}

/* ---------- header ---------- */
.hdr{flex:none;display:flex;align-items:center;gap:12px;padding:10px 18px 12px;color:#fff}
.hdr.sub{padding:12px 18px 16px}
.hdr h1{font-size:19px;font-weight:600;flex:1;min-width:0}
.ib{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#fff;flex:none;position:relative}
.ib:active{background:rgba(255,255,255,.14)}
.dotb{position:absolute;top:8px;right:9px;width:9px;height:9px;border-radius:5px;background:var(--gold-2);border:2px solid var(--teal-900)}
.brand{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;min-width:0}
.brand svg{width:56px;height:auto;flex:none}
.brand .wm{font-size:27px}
.brand .tg{font-size:10.5px;color:#fff;font-weight:500;margin-top:2px;white-space:nowrap}

/* ---------- body & sheet ---------- */
.body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
.body::-webkit-scrollbar{display:none}
.sheet{
  background:var(--sheet);border-radius:28px 28px 0 0;min-height:100%;
  padding:18px 16px 24px;display:flex;flex-direction:column;gap:14px;
}

/* ---------- home welcome ---------- */
.welcome{
  margin:2px 14px 14px;background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.1);border-radius:20px;
  padding:14px;display:flex;align-items:center;gap:14px;color:#fff;
}
.av{
  width:64px;height:64px;border-radius:32px;background:#fff;color:var(--green);
  display:flex;align-items:center;justify-content:center;flex:none;
}
.welcome small{font-size:15px;font-weight:500;display:block;line-height:1.2}
.welcome b{font-size:24px;font-weight:700;display:block;line-height:1.2;letter-spacing:-.01em}
.welcome span{font-size:14px;font-weight:500;display:block;margin-top:4px}

/* ---------- banner ---------- */
.banner{
  position:relative;height:196px;border-radius:22px;overflow:hidden;
  background:linear-gradient(110deg,#0B4F61 0%,#0F6C73 55%,#2E8E78 100%);
  color:#fff;padding:22px 20px;flex:none;
}
.banner h2{
  font-size:27px;line-height:1.14;font-weight:700;letter-spacing:-.015em;
  max-width:60%;position:relative;z-index:2;
}
.banner h2 em{font-style:normal;color:var(--gold-2)}
.banner i.ul{
  display:block;width:52px;height:4px;border-radius:2px;background:var(--gold);
  margin-top:14px;position:relative;z-index:2;
}
.banner svg.art{position:absolute;right:0;bottom:0;height:100%;width:auto;z-index:1}
.dots{
  position:absolute;left:0;right:0;bottom:12px;display:flex;
  justify-content:center;gap:9px;z-index:3;
}
.dots button{width:11px;height:11px;border-radius:6px;background:rgba(255,255,255,.45)}
.dots button.on{background:#fff}
.slide{animation:fade .5s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- tiles ---------- */
.t3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.t3 button{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:4px 2px;min-width:0}
.t3 .ic{
  width:min(76px,100%);aspect-ratio:1;border-radius:22px;
  display:flex;align-items:center;justify-content:center;color:#fff;
  box-shadow:0 10px 18px -8px rgba(6,48,62,.5);margin-bottom:6px;
}
.t3 b{font-size:15px;font-weight:700}
.t3 small,.t2 small{font-size:11.5px;color:var(--mut);font-weight:500;line-height:1.35}
.t2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.t2 button{
  background:#fff;border-radius:22px;padding:10px 10px 14px;
  display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px;
  box-shadow:0 8px 20px -12px rgba(6,48,62,.35);min-width:0;
}
.t2 .ic{
  width:100%;height:84px;border-radius:18px;display:flex;
  align-items:center;justify-content:center;color:#fff;margin-bottom:8px;
}
.t2 b{font-size:16px;font-weight:700}
.g-teal{background:linear-gradient(145deg,#1FA8BE,#0C6A7E)}
.g-gold{background:linear-gradient(145deg,#F2B52A,#D68F10)}
.g-green{background:linear-gradient(145deg,#3CC070,#1E9A4E)}
.g-turq{background:linear-gradient(145deg,#27C3AE,#0E8F86)}
.g-purple{background:linear-gradient(145deg,#7468F0,#4A3FC4)}

/* ---------- goal ---------- */
.goal{
  background:linear-gradient(100deg,#0A4254,#0B3B4C);color:#fff;
  border-radius:18px;padding:14px 16px;display:flex;align-items:center;
  gap:14px;text-align:left;width:100%;
}
.goal b{display:block;color:var(--gold-2);font-size:15px;font-weight:600}
.goal span{display:block;font-size:14.5px;font-weight:500}
.goal .grow{flex:1}

/* ---------- nav ---------- */
.nav{
  flex:none;background:#fff;border-radius:24px 24px 0 0;
  display:flex;padding:8px 6px 6px;
  box-shadow:0 -8px 22px rgba(6,48,62,.18);position:relative;z-index:5;
}
.nav button{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:6px 0 8px;font-size:11.5px;font-weight:500;color:#5A7077;position:relative;
}
.nav button.on{color:var(--green);font-weight:700}
.nav button.on::after{
  content:"";position:absolute;left:20%;right:20%;bottom:0;
  height:3px;border-radius:2px;background:var(--green);
}

/* ---------- chips ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chips button{
  flex:none;border-radius:16px;padding:8px 18px;font-size:12.5px;font-weight:600;
  background:#fff;border:1px solid var(--line);color:var(--ink);
}
.chips button.on{background:var(--green);border-color:var(--green);color:#fff}
.chips.flex button{flex:1}

/* ---------- rows ---------- */
.row{
  display:flex;align-items:center;gap:14px;background:#fff;border-radius:18px;
  padding:12px 14px;box-shadow:0 6px 16px -12px rgba(6,48,62,.4);
  text-align:left;width:100%;min-width:0;
}
.row .sq{
  width:48px;height:48px;border-radius:14px;display:flex;
  align-items:center;justify-content:center;color:#fff;flex:none;
}
.row .tx{flex:1;min-width:0}
.row b{display:block;font-size:14px;font-weight:600;line-height:1.25}
.row small{display:block;font-size:11.5px;color:var(--mut);font-weight:500;margin-top:2px}
.row .ch{color:#9DB0B5;flex:none}
.list{display:flex;flex-direction:column;gap:10px}

/* ---------- CTA ---------- */
.cta{
  min-height:52px;border-radius:16px;background:linear-gradient(90deg,#16A085,#1FA06B);
  color:#fff;font-weight:700;font-size:15px;display:flex;align-items:center;
  justify-content:center;gap:10px;width:100%;
  box-shadow:0 10px 20px -10px rgba(22,160,107,.8);
}
.cta.gold{background:var(--gold);color:var(--ink);box-shadow:none}
.cta.out{background:#fff;color:var(--green);border:2px solid var(--green);box-shadow:none}
.cta.sm{min-height:42px;font-size:13px;border-radius:13px}
.cta[disabled]{opacity:.45;cursor:not-allowed}

/* ---------- badges ---------- */
.pdf{
  display:inline-flex;align-items:center;gap:4px;background:#DCF2E3;color:#17703A;
  font-size:10px;font-weight:700;border-radius:6px;padding:2px 7px;
  margin-top:5px;letter-spacing:.04em;
}
.pdf.az{background:#FBEBC2;color:#7A5600}
.cover{width:54px;height:72px;border-radius:6px;flex:none;box-shadow:0 6px 12px -6px rgba(0,0,0,.5)}

/* ---------- progress ---------- */
.ringrow{display:flex;align-items:center;gap:18px;padding:4px 6px 2px}
.ringrow small{font-size:12px;color:var(--mut);font-weight:600;display:block}
.ringrow b{font-size:26px;color:var(--green);font-weight:700;display:block;line-height:1.1}
.stat{
  display:flex;align-items:center;gap:14px;background:#fff;border-radius:16px;
  padding:12px 14px;box-shadow:0 6px 16px -12px rgba(6,48,62,.4);
}
.stat small{font-size:11px;color:var(--mut);font-weight:600;display:block}
.stat b{font-size:17px;font-weight:700;color:var(--green);display:block}
.h3{font-size:15px;font-weight:700;margin-top:4px}
.act{
  display:flex;align-items:center;gap:12px;padding:10px 2px;
  border-top:1px solid var(--line);
}
.act:first-of-type{border-top:0}
.act .ok{
  width:24px;height:24px;border-radius:12px;background:var(--green);color:#fff;
  display:flex;align-items:center;justify-content:center;flex:none;
}
.act b{font-size:12.5px;font-weight:600;display:block}
.act small{font-size:11px;color:var(--mut)}

/* ---------- quiz ---------- */
.q{font-size:18px;font-weight:600;line-height:1.4}
.opt{
  width:100%;min-height:54px;border-radius:16px;border:2px solid var(--line);
  background:#fff;font-size:15px;font-weight:600;padding:10px 16px;text-align:left;
}
.opt.ok{background:var(--okbg);border-color:var(--green)}
.opt.no{background:var(--badbg);border-color:var(--red)}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:4px;transition:width .3s}

/* ---------- cards ---------- */
.card{
  background:#fff;border-radius:18px;padding:14px 16px;
  box-shadow:0 6px 16px -12px rgba(6,48,62,.4);
  display:flex;flex-direction:column;gap:8px;
}
.card p{font-size:14px;line-height:1.6;font-weight:500}
.mut{color:var(--mut);font-size:12.5px;font-weight:500;line-height:1.5}
.chip{
  display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;
  border-radius:9px;padding:3px 9px;background:#DCF2E3;color:#17703A;
}
.chip.warn{background:#FBEBC2;color:#7A5600}
.chip.live{background:#FBDDD9;color:#9C2A1E}

/* ---------- text ---------- */
.story{font-size:17px;line-height:1.85;font-weight:500}
.w{border-bottom:3px solid var(--gold);font-weight:700;padding:0 1px}
input[type=text],textarea{
  width:100%;border:2px solid var(--line);border-radius:14px;padding:11px 14px;
  font:600 15px var(--f);color:var(--ink);background:#fff;outline:0;
}
textarea{resize:none;min-height:110px;line-height:1.5}
.fl{display:flex;flex-direction:column;gap:6px}
.fl>span{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.score{font-size:60px;font-weight:800;line-height:1;color:var(--green)}
.center{align-items:center;text-align:center}

/* ---------- overlays ---------- */
.layer{position:absolute;inset:0;z-index:30}
.scrim{position:absolute;inset:0;background:rgba(4,22,30,.55);animation:fade .2s}
.panel{
  position:absolute;left:0;right:0;bottom:0;background:#fff;
  border-radius:26px 26px 0 0;padding:18px 18px 26px;max-height:82%;
  overflow:auto;display:flex;flex-direction:column;gap:12px;animation:up .25s;
}
.panel.left{
  top:0;right:auto;width:82%;max-height:none;border-radius:0 26px 26px 0;
  background:linear-gradient(180deg,var(--teal-900),var(--teal-950));
  color:#fff;padding-top:56px;animation:in .25s;
}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes in{from{transform:translateX(-30px);opacity:0}to{transform:none;opacity:1}}
.panel.left .row{background:rgba(255,255,255,.08);box-shadow:none;color:#fff}
.panel.left .row small{color:rgba(255,255,255,.7)}

/* ---------- toast & voice bubble ---------- */
.toast{
  position:absolute;left:16px;right:16px;bottom:96px;background:#12323B;color:#fff;
  border-radius:14px;padding:12px 16px;font-size:13.5px;font-weight:600;z-index:40;
  box-shadow:0 10px 24px rgba(0,0,0,.35);animation:fade .2s;
}
.vb{
  position:absolute;left:14px;right:14px;top:50px;background:#12323B;color:#fff;
  border-radius:16px;padding:10px 14px;font-size:14px;font-weight:600;z-index:41;
  display:flex;gap:10px;align-items:center;
}
.vb i{width:10px;height:10px;border-radius:5px;background:var(--gold-2);flex:none;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
.live-dot{display:inline-block;width:9px;height:9px;border-radius:5px;background:var(--red);animation:pulse 1.2s infinite}

/* ---------- misc ---------- */
table{width:100%;border-collapse:collapse}
.tbl td{padding:7px 4px;border-top:1px solid var(--line);font-weight:600;font-size:13.5px}

/* ---------- responsive ---------- */
@media (max-width:980px){
  .aside{display:none}
  .stage{gap:0}
}
@media (max-width:560px){
  body{padding:0}
  .stage{display:block;height:100%}
  .phone{
    width:100%;height:100%;padding:0;border-radius:0;
    background:none;box-shadow:none;
  }
  .phone .dev{border-radius:0}
  .notch,.status{display:none}
  .hdr{padding-top:max(14px,env(safe-area-inset-top,14px))}
  .brand .wm{font-size:23px}
  .brand svg{width:46px}
  .welcome{margin-top:4px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<div class="stage">
  <aside class="aside" aria-label="Skrini za prototype">
    <div class="icontile" id="icontile"></div>
    <div>
      <div class="up">Rukia skrini · Jump to screen</div>
      <div class="jump" id="jump" style="margin-top:10px"></div>
    </div>
    <small>Prototype ya mwingiliano wa AfriSoma. Gusa kila kitu ndani ya simu: vichupo, masomo, michezo, vitabu, kengele na Mwalimu Live. Malipo na maswali ni ya mfano; data inahifadhiwa kwenye kifaa hiki tu.</small>
  </aside>

  <div class="phone">
    <div class="dev">
      <div class="notch"></div>
      <div class="status"><span>9:41</span><span id="sbicons"></span></div>
      <div class="app" id="app" aria-live="polite"></div>
      <div id="layer"></div>
      <div id="vlayer"></div>
      <div id="tlayer"></div>
    </div>
  </div>
</div>

<script>
/* ================= icons ================= */
const P={
home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',

shelf:'<rect x="3" y="4" width="5" height="16" rx="1"/><rect x="10" y="4" width="5" height="16" rx="1"/><path d="M17 6l3-1 2 14-3 1z"/><path d="M5.5 8v1M12.5 8v1"/>',
game:'<path d="M6 8h12a3 3 0 0 1 3 3v3a3 3 0 0 1-3 3h-1l-2-2h-4l-2 2H6a3 3 0 0 1-3-3v-3a3 3 0 0 1 3-3z"/><path d="M8 11v3M6.5 12.5h3M15.5 11.5h.01M17.5 13.5h.01"/>',

user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/>',
chat:'<path d="M4 5h16v11H11l-5 4v-4H4z"/><path d="M8 9h8M8 12h5"/>',
head:'<path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/>',
pen:'<path d="M4 20l1-4L16 5l3 3L8 19z"/><path d="M14 7l3 3"/>',
speaker:'<path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/>',
search:'<circle cx="11" cy="11" r="6"/><path d="M20 20l-4-4"/>',
back:'<path d="M19 12H5M11 6l-6 6 6 6"/>',
chev:'<path d="M9 5l7 7-7 7"/>',
check:'<path d="M5 12l5 5 9-10"/>',
star:'<path d="M12 2l2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17.3 5.9 20.6l1.4-6.8L2.2 9.1l6.9-.8z"/>',
flame:'<path d="M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 1-9z"/>',
bell:'<path d="M6 8a6 6 0 0 1 12 0c0 6 3 7 3 7H3s3-1 3-7M10 19a2 2 0 0 0 4 0"/>',

  if(!set.has(dayKey(d)))d.setDate(d.getDate()-1);
  while(set.has(dayKey(d))){n++;d.setDate(d.getDate()-1);}
  return{n,today:set.has(dayKey(new Date()))};
}
function act(t){
  const d=new Date();
  S.acts.unshift({t,ts:d.toISOString()});
  S.acts=S.acts.slice(0,12);
  const k=dayKey(d);
  if(S.days.indexOf(k)<0)S.days.push(k);
  save();
}
function whenLbl(iso){
  const d=new Date(iso),n=new Date();
  const tm=d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
  const same=d.toDateString()===n.toDateString();
  const y=new Date();y.setDate(n.getDate()-1);
  return(same?'Leo':(d.toDateString()===y.toDateString()?'Jana':d.toLocaleDateString('sw-KE',{day:'numeric',month:'short'})))+', '+tm;
}
function stats(){
  const mas=Math.min(14,10+S.lessons),maj=Math.min(20,15+S.plays.length);
  const pcts=S.plays.map(p=>p.score/p.max*100);
  const avg=Math.round((85*3+pcts.reduce((a,b)=>a+b,0))/(3+pcts.length));
  const pct=Math.min(100,70+S.lessons*2+S.plays.length);
  return{mas,maj,avg,pct};
}

function toast(m){
  const e=$('tlayer');
  e.innerHTML='<div class="toast" role="status">'+esc(m)+'</div>';
  clearTimeout(tT);

function say(text,rate){
  text=String(text||'').trim();if(!text)return;
  clearTimeout(vT);
  const L=$('vlayer');
  L.innerHTML='<div class="vb" role="status"><i></i><span>'+esc(text)+'</span></div>';
  let spoke=false;
  try{
    if('speechSynthesis' in window&&window.SpeechSynthesisUtterance){
      speechSynthesis.cancel();
      const vs=speechSynthesis.getVoices()||[];
      const v=vs.find(x=>/^sw/i.test(x.lang))||vs.find(x=>/^en-(ke|ug|tz|za)/i.test(x.lang))||vs.find(x=>/^en/i.test(x.lang))||vs[0];
      const u=new SpeechSynthesisUtterance(text);
      if(v)u.voice=v;
      u.lang=v&&/^sw/i.test(v.lang)?v.lang:'sw-KE';
      u.rate=rate||.88;
      u.onend=()=>{vT=setTimeout(()=>{L.innerHTML='';},500);};
      speechSynthesis.speak(u);
      spoke=true;
    }
  }catch(e){}
  vT=setTimeout(()=>{L.innerHTML='';},Math.min(30000,1500+text.length*75)+(spoke?4000:0));
}

/* ================= engine ================= */
function startRun(title,qs,kind,key,meta){
  U.R={
    title,
    qs:shuffle(qs).slice(0,5).map(q=>Object.assign({},q,{o:shuffle(q.opts)})),
    i:0,score:0,pick:null,hint:false,fin:false,kind,key,meta,
    max:Math.min(5,qs.length)*2
  };
  U.view='run';
}
function go(v,push){
  if(push!==false)U.stack.push({view:U.view,tab:U.tab,lib:U.lib,bid:U.bid,lid:U.lid,book:U.book});
  if(v.indexOf('run:')===0){
    const a=v.split(':');
    if(a[1]==='listen')startRun('Kusikiliza',LISTEN,'skill');
    else{
      const f=FUNZO.find(x=>x[0]===a[2]);
      startRun('Funzo '+a[2]+': '+f[1],f[3].map(q=>Object.assign({},q)),'funzo','f'+a[2]);
    }
    U.R.max=U.R.qs.length*2;
  }else if(v.indexOf('lesson:')===0){
    U.lid=v.split(':')[1];U.view='lesson';U.R=null;
  }else{
    U.view=v;
    if(v==='budget')U.budget={};
    if(v==='kuandika')U.essay='';
    if(v==='live'||v==='dict')U.dq='';
  }
  window.scrollTo(0,0);
  render();
}
function back(){
  const p=U.stack.pop();
  if(!p){U.view='home';}
  else Object.assign(U,{view:p.view,tab:p.tab||U.tab||'kozi',lib:p.lib||U.lib||'Hadithi',bid:p.bid||U.bid,lid:p.lid||U.lid,book:p.book||U.book});
  U.R=null;U.speak=null;
  render();
}
function render(){
  showSheet(null);
  const f=V[U.view];if(!f)return;
  const keep=$('app').querySelector('.body');
  const st=keep&&U._v===U.view?keep.scrollTop:0;
  $('app').innerHTML=f()+navHtml();
  U._v=U.view;
  const b=$('app').querySelector('.body');
  if(b)b.scrollTop=st;
  document.querySelectorAll('#jump button').forEach(x=>x.classList.toggle('on',x.dataset.v===U.view||(x.dataset.v==='home'&&U.view==='home')));
}
const NAV=[
  ['home','Nyumbani','home'],
  ['learn','Kujifunza','learn'],
  ['library','Maktaba','shelf'],
  ['games','Michezo','game'],
  ['more','Zaidi','dots']
];
const navHtml=()=>`<nav class="nav" aria-label="Menyu kuu">
  ${NAV.map(n=>`<button data-act="tabnav" data-v="${n[0]}" class="${((U.view==='run'&&U.R&&U.R.kind==='game')?'games':NAVMAP[U.view])===n[0]?'on':''}">${I(n[2],26,1.8)}${n[1]}</button>`).join('')}
</nav>`;
function finishRun(){
  const R=U.R;R.fin=true;
  if(R.kind==='game'){
    S.plays.push({key:R.key,score:R.score,max:R.max,ts:new Date().toISOString()});
    act('Mchezo: '+R.title);
  }else{
    if(R.kind==='funzo')S.done[R.key]=1;
    S.lessons=Math.min(4,S.lessons+1);
    act(R.title);
  }
  save();render();
}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,v=el.dataset.v;
  switch(a){
    case'go':go(v);break;
    case'goclose':showSheet(null);if(v==='cert'||v==='plans')showSheet(v);else{U.stack=[];go(v,false);}break;
    case'cert':case'plans':showSheet(a);break;
    case'back':back();break;
    case'tabnav':U.stack=[];U.R=null;U.view=v;if(v==='learn')U.tab='kozi';render();break;
    case'tab':U.tab=v;render();break;
    case'lib':U.lib=v;render();break;
    case'slide':U.slide=+v;render();break;
    case'bell':showSheet('bell');break;
    case'menu':showSheet('menu');break;
    case'close':showSheet(null);break;
    case'say':if(S.voice)say(v);else{toast(v);}break;
    case'word':showSheet('word',v);break;
    case'endelea':go('run:listen');break;
    case'rd':U.book=v;render();break;
    case'open':{
      const t=v.split(':');
      if(t[0]==='t'){U.book=t[1];go('kusoma');}
      else if(t[0]==='d'){U.bid=t[1];go('dialog');}
      else if(t[0]==='e'){U.bid=t[1];U.shown={};go('exam');}
      else{U.bid=v;go('book');}
      break;
    }
    case'download':S.dl[v]=1;save();toast('Imepakuliwa. Unaweza kusoma bila mtandao.');render();break;
    case'reveal':U.shown=U.shown||{};U.shown[v]=1;render();break;
    case'finish':act(v);toast('Hongera! Shughuli imehifadhiwa kwenye Maendeleo.');break;
    case'game':{const g=GAMES[v];startRun(g.t,g.qs,'game',v);U.stack.push({view:'games'});U.view='run';render();break;}
    case'pick':{const R=U.R;if(R.pick)break;R.pick=v;const q=R.qs[R.i];if(v===q.a)R.score+=2;render();break;}
    case'hint':U.R.hint=true;render();break;
    case'next':{const R=U.R;if(R.i+1>=R.qs.length)finishRun();else{R.i++;R.pick=null;R.hint=false;render();}break;}
    case'again':{
      const R=U.R;
      if(R.kind==='game'){const g=GAMES[R.key];startRun(g.t,g.qs,'game',R.key);}
      else{const t=R.title,k=R.kind,ky=R.key,qs=R.qs.map(q=>({q:q.q,say:q.say,opts:q.opts,a:q.a,hint:q.hint}));startRun(t,qs,k,ky);U.R.max=U.R.qs.length*2;}
      render();break;
    }
    case'lpick':{const l=LESSONS.find(x=>x.id===U.lid);U.R={lesson:l.id,pick:v};render();break;}
    case'lfinish':{const l=LESSONS.find(x=>x.id===U.lid);S.done[l.id]=1;S.lessons=Math.min(4,S.lessons+1);act('Somo: '+l.t);save();toast('Somo limekamilika!');back();break;}
    case'bsel':U.budget[v]=!U.budget[v];render();break;
    case'bfin':{S.lessons=Math.min(4,S.lessons+1);S.done.fg=1;act('Insha ya bajeti');save();toast('Bajeti imehifadhiwa. Hongera!');back();break;}
    case'saveEssay':S.essays.unshift({t:U.essay,ts:new Date().toISOString()});act('Kuandika: insha fupi');save();U.essay='';toast('Insha imehifadhiwa.');render();break;
    case'speak':startSpeak(+v);break;
    case'saveName':{const n=(U.nm||S.name).trim();if(n){S.name=n;save();toast('Jina limehifadhiwa.');render();}break;}
    case'toggleVoice':S.voice=!S.voice;save();render();break;
    case'reset':S=fresh();save();toast('Data imefutwa.');go('home',false);U.stack=[];break;
    case'remind':S.remind[v]=!S.remind[v];save();toast(S.remind[v]?'Umejiunga. Tutakukumbusha kabla ya darasa.':'Umetoka kwenye darasa.');render();break;
    case'ask':{const t=(U.ask||'').trim();if(t.length<5){toast('Andika swali lako kwanza.');break;}S.qs.unshift({t,ts:new Date().toISOString()});act('Swali kwa mwalimu');save();U.ask='';toast('Swali limetumwa kwa mwalimu (mfano).');render();break;}
    case'jump':U.stack=[];U.R=null;go(v,false);break;
  }
});

document.addEventListener('input',e=>{
  const t=e.target;if(!t.dataset||!t.dataset.bind)return;
  const k=t.dataset.bind;U[k]=t.value;
  if(k==='essay'){
    const s=t.value.trim(),n=s?s.split(/\s+/).length:0;
    const used=['bei','deni','faida','salio','mteja','bajeti'].filter(w=>t.value.toLowerCase().indexOf(w)>=0);
    $('wc').textContent=n;
    $('wused').textContent='Maneno ya Biashara yaliyotumika: '+(used.length?used.join(', '):'bado');
    $('wbar').style.width=Math.min(100,used.length/3*100)+'%';
    $('saveE').disabled=used.length<3||n<8;
  }
  if(k==='dq'){
    const q=t.value.toLowerCase().trim();
    $('dres').innerHTML=dictRows(Object.keys(DICT).filter(x=>!q||x.indexOf(q)>=0||DICT[x].en.toLowerCase().indexOf(q)>=0).sort());
  }
});

function startSpeak(i){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  U.speak={i,res:null};
  if(!SR){
    U.speak.res='Rudia sentensi kwa sauti. Kipaza sauti hakipatikani kwenye kivinjari hiki, kwa hiyo tunahesabu kuwa umejaribu.';
    act('Kuzungumza: '+PHRASES[i][0]);
    toast('Zoezi la kuzungumza limehifadhiwa.');
    render();return;
  }
  try{
    const r=new SR();r.lang='sw-KE';r.interimResults=false;
    U.listening=true;
    r.onresult=ev=>{
      const said=ev.results[0][0].transcript;
      const norm=s=>s.toLowerCase().replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(Boolean);
      const t=norm(PHRASES[i][1]),sd=norm(said);
      const hit=t.filter(w=>sd.indexOf(w)>=0).length;
      U.speak.res='Umesema: "'+said+'" · Usahihi '+Math.round(hit/t.length*100)+'%';
      act('Kuzungumza: '+PHRASES[i][0]);
    };
    r.onerror=()=>{U.speak.res='Haikusikika vizuri. Jaribu tena kwa sauti ya juu zaidi.';};
    r.onend=()=>{U.listening=false;render();};
    r.start();render();
  }catch(e){
    U.listening=false;U.speak.res='Jaribu tena.';render();
  }
}

/* ================= boot ================= */
$('icontile').innerHTML=logo('t')+'<div class="wm" style="font-size:clamp(34px,4.4vw,48px)">AfriSoma</div><div class="tag" style="font-size:clamp(13px,1.5vw,16px)">Jifunze Kiswahili kidigitali</div>';
$('jump').innerHTML=JUMPS.map(j=>`<button data-act="jump" data-v="${j[0]}">${j[1]}</button>`).join('');
$('sbicons').innerHTML='<svg width="18" height="12" viewBox="0 0 18 12" fill="#fff"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg><svg width="26" height="12" viewBox="0 0 26 12" fill="none"><rect x=".5" y=".5" width="22" height="11" rx="3.5" stroke="#fff" opacity=".6"/><rect x="2" y="2" width="19" height="8" rx="2" fill="#fff"/><rect x="24" y="4" width="2" height="4" rx="1" fill="#fff" opacity=".6"/></svg>';
try{if('speechSynthesis' in window)speechSynthesis.getVoices();}catch(e){}
setInterval(()=>{
  if(U.view==='home'&&!U.sheet){
    U.slide=(U.slide+1)%SLIDES.length;
    if(document.querySelector('.banner h2'))render();
  }
},5200);
render();
</script>
